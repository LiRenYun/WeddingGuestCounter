<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>賓客報到</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2214%22 y=%2214%22 width=%2272%22 height=%2272%22 rx=%2212%22 fill=%22%23B8402E%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ---------- Tokens: 紙本喜帖 × 紅印（報到 = 蓋章） ---------- */
    :root {
      --paper: #f6f1e7;
      --surface: #fffdf8;
      --ink: #2a2622;
      --ink-2: #5c544b;
      --ink-3: #8a8178;
      --line: #e4dacb;
      --line-strong: #c9bca8;
      --seal: #b8402e;
      --seal-hover: #a13623;
      --seal-ink: #fff8f0;
      --seal-soft: #f3dcd3;
      --groom: #2f4a6d;
      --groom-soft: #e1e8f1;
      --bride: #a4505f;
      --bride-soft: #f3e1e4;
      --ok: #3d7a5a;
      --ok-soft: #dcebe2;
      --warn: #9a6200;
      --warn-soft: #f6e9c8;
      --nogift: #6d4a92;
      --nogift-soft: #ece3f5;
      --focus: #2f4a6d;
      --radius: 12px;
      --radius-sm: 8px;
      --serif: 'Noto Serif TC', 'Songti TC', serif;
      --sans: 'Noto Sans TC', -apple-system, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #17140f;
        --surface: #211d17;
        --ink: #f3ece0;
        --ink-2: #c7bcab;
        --ink-3: #958b7c;
        --line: #3a3328;
        --line-strong: #5a4f40;
        --seal: #e06b55;
        --seal-hover: #ec7f69;
        --seal-ink: #17140f;
        --seal-soft: #3d2620;
        --groom: #9bbbe0;
        --groom-soft: #1f2a38;
        --bride: #e8a0ad;
        --bride-soft: #3a2328;
        --ok: #7fc29a;
        --ok-soft: #1d3327;
        --warn: #e7b65c;
        --warn-soft: #3a2f16;
        --nogift: #c9a6ea;
        --nogift-soft: #2e2440;
        --focus: #9bbbe0;
      }
    }
    :root[data-theme="dark"] {
      --paper: #17140f;
      --surface: #211d17;
      --ink: #f3ece0;
      --ink-2: #c7bcab;
      --ink-3: #958b7c;
      --line: #3a3328;
      --line-strong: #5a4f40;
      --seal: #e06b55;
      --seal-hover: #ec7f69;
      --seal-ink: #17140f;
      --seal-soft: #3d2620;
      --groom: #9bbbe0;
      --groom-soft: #1f2a38;
      --bride: #e8a0ad;
      --bride-soft: #3a2328;
      --ok: #7fc29a;
      --ok-soft: #1d3327;
      --warn: #e7b65c;
      --warn-soft: #3a2f16;
      --focus: #9bbbe0;
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .page {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 20px 16px max(28px, env(safe-area-inset-bottom));
    }

    /* ---------- Masthead ---------- */
    .masthead { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-family: var(--serif); font-weight: 900; font-size: 1.7rem; letter-spacing: 0.02em; }
    .sync { font-size: 0.85rem; color: var(--ink-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sync[data-state="error"] { color: var(--warn); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
    .sync[data-state="saving"] .sync-dot { background: var(--ink-3); }
    .sync[data-state="error"] .sync-dot { background: var(--warn); }
    .link-btn { background: none; border: none; color: var(--groom); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; font-size: 0.85rem; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 0 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .btn:hover { border-color: var(--ink-2); }
    .btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
    .btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---------- Stats (native details) ---------- */
    .stats { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px 0; margin-bottom: 16px; }
    .stats summary { list-style: none; cursor: pointer; font-weight: 500; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
    .stats summary::-webkit-details-marker { display: none; }
    .stats summary::after { content: '展開'; font-size: 0.85rem; color: var(--ink-3); }
    .stats[open] summary::after { content: '收合'; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; margin-top: 8px; }
    .stat-grid > div { padding: 8px 4px; }
    .stat-grid dt { font-size: 0.85rem; color: var(--ink-3); }
    .stat-grid dd { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-grid dd small { font-family: var(--sans); font-size: 0.85rem; font-weight: 400; color: var(--ink-3); margin-left: 2px; }
    .amounts-hidden .money { filter: blur(6px); user-select: none; }

    /* ---------- Controls ---------- */
    .controls { display: grid; gap: 10px; margin-bottom: 14px; }
    .segmented { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; justify-self: start; }
    .seg { min-height: 36px; padding: 0 16px; border: none; background: none; border-radius: 999px; color: var(--ink-2); font-weight: 500; }
    .seg[aria-selected="true"] { background: var(--ink); color: var(--paper); }
    .toolbar { display: flex; gap: 8px; }
    .search { flex: 1; position: relative; display: flex; align-items: center; }
    .search .icon { position: absolute; left: 12px; color: var(--ink-3); pointer-events: none; }
    .search input {
      width: 100%; min-height: 44px; padding: 0 12px 0 40px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: var(--surface); font-size: 1rem;
    }
    .search input:focus { outline: none; border-color: var(--groom); box-shadow: 0 0 0 3px var(--groom-soft); }
    .select, .sort-select {
      min-height: 44px; padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
      background: var(--surface); font-size: 0.95rem;
    }
    .icon-btn { width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); }

    /* ---------- Guest roll (ledger rows) ---------- */
    .roll { list-style: none; display: grid; grid-template-columns: 1fr; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .row { position: relative; display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
    .row[data-side="groom"]::before { background: var(--groom); }
    .row[data-side="bride"]::before { background: var(--bride); }

    /* 報到印章：未報到為空框，報到後為紅印並顯示序號 */
    .seal {
      width: 58px; height: 58px; border-radius: 10px; display: grid; place-items: center; text-align: center;
      border: 1.5px solid var(--line-strong); background: transparent; color: var(--ink-2);
      font-weight: 500; font-size: 0.95rem; line-height: 1.15; transition: background-color .15s ease, color .15s ease;
    }
    .seal:hover { border-color: var(--seal); color: var(--seal); }
    .seal:disabled { cursor: progress; opacity: .6; }
    .seal.is-in { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
    .seal.is-in:hover { background: var(--seal-hover); border-color: var(--seal-hover); color: var(--seal-ink); }
    .seal-no { display: block; font-family: var(--serif); font-size: 1.45rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .seal-no-label { display: block; font-size: 0.7rem; opacity: .9; }
    .seal.is-new { animation: stamp .32s cubic-bezier(.2, .8, .2, 1); }
    @keyframes stamp { 0% { transform: scale(1.22); } 100% { transform: scale(1); } }

    .row-main { all: unset; display: block; min-width: 0; cursor: pointer; border-radius: 6px; }
    .row-main:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .name-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
    .name { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; }
    .side-tag { font-size: 0.8rem; font-weight: 500; }
    .side-tag.groom { color: var(--groom); }
    .side-tag.bride { color: var(--bride); }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 0.85rem; color: var(--ink-2); }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); white-space: nowrap; }
    .chip.seat { font-variant-numeric: tabular-nums; }
    .chip.unassigned { color: var(--ink-3); border-style: dashed; }
    .chip.cake { color: var(--warn); }
    /* 備註：整行顯示、完整換行，不截斷 */
    .meta .note {
      flex-basis: 100%; white-space: normal; overflow-wrap: anywhere;
      padding: 4px 10px; border-left: 3px solid var(--line-strong); background: var(--paper);
      border-radius: 0 6px 6px 0; color: var(--ink); font-size: 0.92rem;
    }
    .row-side { text-align: right; }
    .row-amount { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
    .row-amount.has { color: var(--ink); }
    .row-time { font-size: 0.75rem; color: var(--ink-3); margin-top: 2px; }
    /* 葷素與不收取禮金：小標籤，一眼可辨 */
    .badge {
      display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; border: 1px solid transparent; white-space: nowrap;
    }
    .badge.veg { color: var(--ok); background: var(--ok-soft); border-color: var(--ok); }
    .badge.meat { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
    .badge.nogift { color: var(--nogift); background: var(--nogift-soft); border-color: var(--nogift); }

    .empty { padding: 40px 16px; text-align: center; color: var(--ink-3); }
    .skeleton { padding: 40px 16px; text-align: center; color: var(--ink-3); }

    /* ---------- Edit view ---------- */
    #edit-view { max-width: 640px; margin: 0 auto; }
    .edit-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .edit-title { font-family: var(--serif); font-size: 1.5rem; font-weight: 900; }
    .edit-sub { font-size: 0.85rem; color: var(--ink-3); width: 100%; }
    .edit-form { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .field label, .field .label { display: block; font-size: 0.9rem; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; min-height: 44px; padding: 8px 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: var(--paper); font-size: 1rem;
    }
    .field input[readonly] { color: var(--ink-2); background: transparent; border-style: dashed; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--groom); box-shadow: 0 0 0 3px var(--groom-soft); }
    .field textarea { min-height: 80px; resize: vertical; }
    .field input[type="number"] { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .preset { min-height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--paper); font-size: 0.9rem; }
    .preset:hover { border-color: var(--ink-2); }
    .inline { display: flex; gap: 8px; }
    .inline input { flex: 1; }
    .check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 0.95rem; color: var(--ink-2); }
    .check-row input { width: 20px; height: 20px; accent-color: var(--seal); }
    .form-actions { display: flex; gap: 10px; margin-top: 4px; }
    .form-actions .btn { flex: 1; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      max-width: calc(100% - 32px); padding: 12px 18px; border-radius: var(--radius-sm);
      background: var(--ink); color: var(--paper); box-shadow: 0 10px 24px rgba(0, 0, 0, .18); z-index: 50; font-size: 0.95rem;
    }
    .toast.is-error { background: var(--warn); color: #fff; }

    /* ---------- Responsive ---------- */
    @media (min-width: 640px) {
      .stat-grid { grid-template-columns: repeat(5, 1fr); }
      .edit-form { grid-template-columns: 1fr 1fr; padding: 22px; }
      .edit-form .span-2 { grid-column: 1 / -1; }
    }
    @media (min-width: 768px) {
      .page { padding-top: 28px; }
      h1 { font-size: 2rem; }
      .roll { grid-template-columns: 1fr 1fr; }
      .row { border-right: 1px solid var(--line); }
      .row:nth-child(2n) { border-right: none; }
      .row:nth-last-child(-n+2) { border-bottom: none; }
      .controls { grid-template-columns: auto 1fr; align-items: center; }
      .toolbar { grid-column: 1 / -1; }
    }
    @media (min-width: 1200px) {
      .page { max-width: 1120px; }
      .roll { grid-template-columns: 1fr 1fr 1fr; }
      .row:nth-child(2n) { border-right: 1px solid var(--line); }
      .row:nth-child(3n) { border-right: none; }
      .row:nth-last-child(-n+2) { border-bottom: 1px solid var(--line); }
      .row:nth-last-child(-n+3) { border-bottom: none; }
    }
    @media (max-width: 380px) {
      .row { grid-template-columns: 52px 1fr; }
      .row-side { grid-column: 2; text-align: left; }
      .seal { width: 52px; height: 52px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="title-row">
        <h1>賓客報到</h1>
        <button id="btn-add" class="btn btn-primary" type="button">新增賓客</button>
      </div>
      <p id="sync-status" class="sync" data-state="saving" role="status" aria-live="polite">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="sync-text">載入中…</span>
        <button id="btn-resync" class="link-btn" type="button">重新讀取</button>
      </p>
    </header>

    <details id="stats" class="stats">
      <summary>報到統計</summary>
      <dl class="stat-grid">
        <div><dt>已報到 / 總人數</dt><dd id="stat-total-guests">0 / 0</dd></div>
        <div><dt>男方</dt><dd id="stat-groom-count">0 / 0</dd></div>
        <div><dt>女方</dt><dd id="stat-bride-count">0 / 0</dd></div>
        <div><dt>喜餅</dt><dd id="stat-total-cakes">0<small>盒</small></dd></div>
        <div><dt>禮金</dt><dd><span id="stat-total-amount" class="money">$0</span></dd></div>
      </dl>
    </details>

    <section id="list-view" aria-label="賓客名單">
      <div class="controls">
        <div class="segmented" role="tablist" aria-label="陣營篩選">
          <button class="seg" type="button" role="tab" data-filter="all" aria-selected="true">全部</button>
          <button class="seg" type="button" role="tab" data-filter="groom" aria-selected="false">男方</button>
          <button class="seg" type="button" role="tab" data-filter="bride" aria-selected="false">女方</button>
        </div>
        <div class="toolbar">
          <label class="search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span class="sr-only">搜尋賓客</span>
            <input id="search-input" type="search" placeholder="搜尋姓名、陣營、備註" autocomplete="off">
          </label>
          <select id="sort-select" class="sort-select" aria-label="排序方式">
            <option value="name">姓名 A→Z</option>
            <option value="checkin-seq">報到順序</option>
            <option value="seat">桌號座位</option>
            <option value="amount-desc">金額 高→低</option>
            <option value="side">陣營</option>
            <option value="default">登錄順序</option>
          </select>
          <button id="toggle-amounts" class="icon-btn" type="button" aria-label="隱藏或顯示金額" aria-pressed="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <ul id="guest-list" class="roll">
        <li class="skeleton">正在載入賓客資料…</li>
      </ul>
    </section>

    <section id="edit-view" class="hidden" aria-labelledby="view-title">
      <div class="edit-head">
        <button id="btn-back" class="btn" type="button">← 返回名單</button>
        <button id="btn-checkin" class="btn" type="button">確認報到</button>
        <h2 id="view-title" class="edit-title">編輯禮金</h2>
        <p id="view-update-time" class="edit-sub hidden"></p>
      </div>

      <form id="edit-form" class="edit-form">
        <div class="field span-2">
          <label for="edit-name">賓客姓名</label>
          <input type="text" id="edit-name" required autocomplete="off">
        </div>

        <div class="field">
          <label for="edit-side">親友陣營</label>
          <input type="text" id="edit-side" readonly>
          <select id="edit-side-select" class="hidden">
            <option value="">請選擇陣營</option>
            <option value="男方親友">男方親友</option>
            <option value="女方親友">女方親友</option>
          </select>
        </div>

        <div class="field">
          <span class="label">不收取禮金</span>
          <label class="check-row"><input type="checkbox" id="edit-nogift"> 標記為不收取禮金</label>
        </div>

        <div class="field span-2">
          <label for="edit-amount">禮金金額（NT$）</label>
          <input type="number" id="edit-amount" min="0" step="100" inputmode="numeric" required>
          <div class="presets" id="amount-presets">
            <button type="button" class="preset" data-add="100">+100</button>
            <button type="button" class="preset" data-add="500">+500</button>
            <button type="button" class="preset" data-add="800">+800</button>
            <button type="button" class="preset" data-add="1000">+1,000</button>
            <button type="button" class="preset" data-add="2000">+2,000</button>
            <button type="button" class="preset" data-set="0">歸零</button>
          </div>
        </div>

        <div class="field">
          <label for="edit-cakes">喜餅數量（盒）</label>
          <div class="inline">
            <input type="number" id="edit-cakes" min="0" step="1" inputmode="numeric">
            <button type="button" class="preset" id="cake-add">+1</button>
            <button type="button" class="preset" id="cake-zero">歸零</button>
          </div>
        </div>

        <div class="field span-2">
          <label for="edit-note">備註 / 合包明細</label>
          <textarea id="edit-note" placeholder="例如：與林小美合包、代包紅包…"></textarea>
        </div>

        <div class="form-actions span-2">
          <button type="button" id="cancel-btn" class="btn">取消</button>
