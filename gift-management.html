<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <title>賓客報到系統</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff2f6 0%, #fbf4fb 40%, #fef8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(240, 100, 145, 0.15);
      --card-glass-shadow: 0 10px 30px -4px rgba(220, 90, 130, 0.12), 0 4px 10px -2px rgba(0, 0, 0, 0.04);
      --item-bg: #ffffff;
      --item-border: rgba(240, 100, 145, 0.12);
      --item-hover-bg: #fffbfd;
      
      --primary: #f05a88;
      --primary-hover: #e04474;
      --primary-light: #ffdce8;
      --primary-glow: rgba(240, 90, 136, 0.25);
      
      --accent: #f59e0b;
      --accent-light: #fef3c7;
      --success: #10b981;
      --success-light: #d1fae5;
      --success-glow: rgba(16, 185, 129, 0.2);
      
      --text-main: #1f2937;
      --text-sub: #4b5563;
      --text-muted: #9ca3af;
      --text-light: #6b7280;
      
      --side-groom: #3b82f6;
      --side-groom-bg: rgba(59, 130, 246, 0.1);
      --side-groom-border: rgba(59, 130, 246, 0.2);
      
      --side-bride: #ec4899;
      --side-bride-bg: rgba(236, 72, 153, 0.1);
      --side-bride-border: rgba(236, 72, 153, 0.2);
      
      --input-bg: #ffffff;
      --input-border: #e5e7eb;
      --input-focus-border: #f05a88;
      
      --btn-secondary-bg: #f9fafb;
      --btn-secondary-text: #374151;
      --btn-secondary-border: #e5e7eb;

      --stat-card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 245, 250, 0.9));
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-gradient: linear-gradient(135deg, #18111d 0%, #1a162b 50%, #201322 100%);
        --card-bg: rgba(32, 26, 44, 0.9);
        --card-border: rgba(240, 90, 136, 0.2);
        --card-glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        --item-bg: rgba(42, 35, 58, 0.85);
        --item-border: rgba(255, 255, 255, 0.08);
        --item-hover-bg: rgba(52, 43, 72, 0.95);
        
        --primary: #f472b6;
        --primary-hover: #ec4899;
        --primary-light: rgba(244, 114, 182, 0.2);
        --primary-glow: rgba(244, 114, 182, 0.35);
        
        --text-main: #f9fafb;
        --text-sub: #d1d5db;
        --text-muted: #9ca3af;
        --text-light: #9ca3af;
        
        --side-groom: #60a5fa;
        --side-groom-bg: rgba(96, 165, 250, 0.18);
        --side-groom-border: rgba(96, 165, 250, 0.3);
        
        --side-bride: #f472b6;
        --side-bride-bg: rgba(244, 114, 182, 0.18);
        --side-bride-border: rgba(244, 114, 182, 0.3);
        
        --input-bg: rgba(26, 21, 38, 0.9);
        --input-border: rgba(255, 255, 255, 0.12);
        --input-focus-border: #f472b6;
        
        --btn-secondary-bg: rgba(45, 38, 62, 0.8);
        --btn-secondary-text: #f3f4f6;
        --btn-secondary-border: rgba(255, 255, 255, 0.12);

        --success-light: rgba(16, 185, 129, 0.2);
        --stat-card-bg: linear-gradient(135deg, rgba(38, 30, 54, 0.95), rgba(46, 35, 62, 0.9));
      }
      :root:not([data-theme="light"]) .guest-name.paid {
        color: #34d399;
        background: rgba(16, 185, 129, 0.18);
        border-color: rgba(16, 185, 129, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.5;
      padding: 12px 14px max(14px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }

    /* Privacy Blur State */
    body.amounts-hidden .guest-amount-val {
      filter: blur(8px);
      user-select: none;
      opacity: 0.25;
    }
    body.amounts-hidden .stat-amount-val {
      filter: blur(8px);
      user-select: none;
      opacity: 0.25;
    }

    .container {
      width: 100%;
      max-width: 860px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 0 auto;
    }

    /* Header */
    .header {
      flex-shrink: 0;
      text-align: center;
      margin-bottom: 8px;
      position: relative;
    }

    .header h1 {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(135deg, #f05a88 0%, #ec4899 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    /* Collapsible Stat Section */
    .stat-section {
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .stat-toggle-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 6px;
    }

    .btn-toggle-stats {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-full);
      padding: 4px 14px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
    }

    .btn-toggle-stats:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--item-hover-bg);
    }

    .stat-dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .stat-dashboard.collapsed {
      display: none;
    }

    .stat-item {
      background: var(--stat-card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      backdrop-filter: blur(8px);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .stat-value {
      font-family: 'Poppins', 'Noto Sans TC', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-value.highlight {
      color: var(--primary);
    }

    .stat-subtext {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Main List View */
    #list-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--card-glass-shadow);
      animation: fadeIn 0.25s ease;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Filter Bar */
    .filter-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      background: var(--btn-secondary-bg);
      padding: 3px;
      border-radius: var(--radius-full);
      border: 1px solid var(--input-border);
      gap: 2px;
      flex: 1;
      max-width: 280px;
    }

    .filter-btn {
      flex: 1;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      text-align: center;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .btn-add-guest {
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #f05a88 0%, #ec4899 100%);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 12px var(--primary-glow);
      transition: all 0.2s ease;
    }

    .btn-add-guest:hover {
      transform: translateY(-1px);
    }

    /* Toolbar (Search & Actions) */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }

    .search-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      font-size: 0.95rem;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 10px 34px 10px 36px;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-md);
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .clear-search-btn:hover {
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.05);
    }

    .icon-btn {
      height: 42px;
      width: 42px;
      padding: 0;
      font-size: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-md);
      background: var(--input-bg);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--primary);
      background: var(--item-hover-bg);
    }

    /* Guest List - Only scrollable area */
    .guest-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }

    .guest-list::-webkit-scrollbar {
      width: 6px;
    }

    .guest-list::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 4px;
    }

    .guest-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .guest-item:hover {
      background: var(--item-hover-bg);
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(240, 90, 136, 0.08);
    }

    .guest-item:active {
      transform: translateY(0);
    }

    .guest-item-main {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .guest-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .guest-avatar.groom {
      background: var(--side-groom-bg);
      color: var(--side-groom);
      border: 1px solid var(--side-groom-border);
    }

    .guest-avatar.bride {
      background: var(--side-bride-bg);
      color: var(--side-bride);
      border: 1px solid var(--side-bride-border);
    }

    .guest-details {
      flex: 1;
      min-width: 0;
    }

    .guest-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .guest-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
      padding: 1px 4px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .guest-name.paid {
      background: var(--success-light);
      color: #047857;
      padding: 2px 8px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      box-shadow: 0 1px 4px var(--success-glow);
    }

    .guest-side-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: var(--radius-full);
      display: inline-block;
    }

    .guest-side-badge.groom {
      background: var(--side-groom-bg);
      color: var(--side-groom);
    }

    .guest-side-badge.bride {
      background: var(--side-bride-bg);
      color: var(--side-bride);
    }

    .guest-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .guest-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-sub);
    }

    .guest-tag.cake {
      background: var(--accent-light);
      color: #b45309;
      font-weight: 600;
    }

    .guest-tag.time {
      color: var(--text-muted);
    }

    .guest-amount-wrap {
      text-align: right;
      flex-shrink: 0;
    }

    .guest-amount-val {
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .guest-amount-val.paid {
      color: var(--success);
      background: var(--success-light);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 1.15rem;
      box-shadow: 0 2px 6px var(--success-glow);
    }

    /* Edit View */
    #edit-view {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .edit-view-card {
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .edit-header {
      text-align: center;
      margin-bottom: 16px;
      position: relative;
    }

    .btn-back {
      position: absolute;
      left: 0;
      top: 0;
      background: var(--btn-secondary-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-full);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .edit-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .edit-time-subtitle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: rgba(240, 90, 136, 0.08);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .edit-time-subtitle.hidden {
      display: none !important;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 1rem;
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-md);
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-group input:read-only {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-muted);
      cursor: not-allowed;
      border-color: var(--input-border);
    }

    .form-group input[type="number"] {
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Quick Preset Amounts */
    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .btn-quick-amount {
      padding: 7px 4px;
      font-family: 'Poppins', 'Noto Sans TC', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      background: var(--btn-secondary-bg);
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn-quick-amount:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .btn-quick-amount:active {
      transform: scale(0.96);
    }

    /* Cake Quick Helper Row */
    .cake-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cake-row input {
      flex: 1;
    }

    .quick-cake-actions {
      display: flex;
      gap: 6px;
    }

    .btn-quick-cake {
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      background: var(--btn-secondary-bg);
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-quick-cake:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .btn-quick-cake:active {
      transform: scale(0.96);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 64px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      min-height: 44px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f05a88 0%, #ec4899 100%);
      color: #ffffff;
      box-shadow: 0 3px 12px var(--primary-glow);
    }

    .btn-primary:hover {
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1.5px solid var(--btn-secondary-border);
    }

    /* States & Feedback */
    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 8px;
      opacity: 0.6;
    }

    .loading-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      left: auto;
      max-width: 360px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--card-glass-shadow);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid #ef4444;
    }

    .hidden {
      display: none !important;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      body {
        padding: 8px 8px max(10px, env(safe-area-inset-bottom));
      }

      .header h1 {
        font-size: 1.45rem;
      }

      .card {
        padding: 12px;
        border-radius: var(--radius-md);
      }

      .stat-dashboard {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .stat-item {
        padding: 6px 4px;
      }

      .stat-value {
        font-size: 0.98rem;
      }

      .filter-bar {
        gap: 6px;
        margin-bottom: 8px;
      }

      .filter-group {
        max-width: 100%;
        order: 1;
      }

      .btn-add-guest {
        order: 2;
        width: 100%;
        justify-content: center;
        padding: 8px 12px;
      }

      .toolbar {
        margin-bottom: 8px;
      }

      .guest-item {
        padding: 10px 12px;
        gap: 8px;
      }

      .guest-avatar {
        width: 34px;
        height: 34px;
        font-size: 0.9rem;
      }

      .guest-name {
        font-size: 0.98rem;
      }

      .guest-amount-val {
        font-size: 1.1rem;
      }

      .guest-amount-val.paid {
        font-size: 1rem;
        padding: 2px 8px;
      }

      .toast {
        right: 10px;
        left: 10px;
        top: 10px;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>賓客報到系統</h1>
    </header>

    <!-- Collapsible Stat Section -->
    <section class="stat-section">
      <div class="stat-toggle-wrap">
        <button id="toggle-stats-btn" class="btn-toggle-stats" aria-expanded="false">
          📊 報到統計看板 ▾
        </button>
      </div>
      <div class="stat-dashboard collapsed" id="stat-dashboard">
        <div class="stat-item">
          <div class="stat-label">👥 總報到人數</div>
          <div class="stat-value" id="stat-total-guests">0 / 0 <span class="stat-subtext">人</span></div>
        </div>
        <div class="stat-item">
          <div class="stat-label">💰 已收禮金</div>
          <div class="stat-value highlight stat-amount-val" id="stat-total-amount">$0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">🤵 男方報到</div>
          <div class="stat-value" id="stat-groom-count">0 / 0 <span class="stat-subtext">人</span></div>
        </div>
        <div class="stat-item">
          <div class="stat-label">👰 女方報到</div>
          <div class="stat-value" id="stat-bride-count">0 / 0 <span class="stat-subtext">人</span></div>
        </div>
      </div>
    </section>

    <!-- List View -->
    <main id="list-view">
      <div class="card">
        <!-- Filter Tabs & Add Button -->
        <div class="filter-bar">
          <div class="filter-group" role="tablist">
            <button class="filter-btn active" data-filter="all" role="tab">全部</button>
            <button class="filter-btn" data-filter="groom" role="tab">男方</button>
            <button class="filter-btn" data-filter="bride" role="tab">女方</button>
          </div>
          <button id="btn-add" class="btn-add-guest" title="新增賓客">
            <span>＋</span> 新增賓客
          </button>
        </div>

        <!-- Search & Privacy Toggle -->
        <div class="toolbar">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="搜尋姓名、陣營或備註..." autocomplete="off">
            <button id="clear-search" class="clear-search-btn" title="清除搜尋">✕</button>
          </div>
          <button id="toggle-amounts" class="icon-btn" title="切換金額隱藏/顯示" aria-label="隱藏或顯示金額">
            <span id="eye-icon">🙈</span>
          </button>
        </div>

        <!-- Guest List Container (Only scrollable element) -->
        <div id="guest-list" class="guest-list">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>正在載入禮金資料...</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Edit / Add View -->
    <section id="edit-view" class="hidden">
      <div class="card edit-view-card">
        <div class="edit-header">
          <button type="button" id="btn-back" class="btn-back">← 返回</button>
          <h2 id="view-title" class="edit-title">編輯禮金</h2>
          <div id="view-update-time" class="edit-time-subtitle hidden">
            <span>🕒</span> <span id="update-time-text">更新時間：-</span>
          </div>
        </div>

        <form id="edit-form">
          <div class="form-group">
            <label for="edit-name">賓客姓名</label>
            <input type="text" id="edit-name" placeholder="請輸入姓名" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="edit-side">親友陣營</label>
            <input type="text" id="edit-side" readonly style="display: block;">
            <select id="edit-side-select" style="display: none;">
              <option value="">請選擇陣營</option>
              <option value="男方親友">男方親友</option>
              <option value="女方親友">女方親友</option>
            </select>
          </div>

          <div class="form-group">
            <label for="edit-amount">禮金金額 (NT$)</label>
            <input type="number" id="edit-amount" min="0" step="100" placeholder="0" required inputmode="numeric">
            
            <!-- Quick Preset Amount Buttons -->
            <div class="quick-amounts">
              <button type="button" class="btn-quick-amount" data-add="1000">+1,000</button>
              <button type="button" class="btn-quick-amount" data-add="2000">+2,000</button>
              <button type="button" class="btn-quick-amount" data-set="3600">3,600</button>
              <button type="button" class="btn-quick-amount" data-set="6000">6,000</button>
              <button type="button" class="btn-quick-amount" data-set="10000">10,000</button>
              <button type="button" class="btn-quick-amount" data-set="0">歸零 0</button>
            </div>
          </div>

          <div class="form-group">
            <label for="edit-cakes">喜餅數量</label>
            <div class="cake-row">
              <input type="number" id="edit-cakes" min="0" step="1" placeholder="0" inputmode="numeric">
              <div class="quick-cake-actions">
                <button type="button" class="btn-quick-cake" data-cake-add="1">＋1 盒</button>
                <button type="button" class="btn-quick-cake" data-cake-set="0">歸零 0</button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="edit-note">備註 / 合包明細</label>
            <textarea id="edit-note" placeholder="例如：與林小美合包、代包紅包..."></textarea>
          </div>

          <div class="form-actions">
            <button type="button" id="cancel-btn" class="btn btn-secondary">取消</button>
            <button type="submit" id="save-btn" class="btn btn-primary">確認儲存</button>
          </div>
        </form>
      </div>
    </section>
  </div>

  <script src="gift-management.js"></script>
</body>
</html>
